# Klanten-bestelapp: aparte Netlify-site met base directory "bestel".
# producten.js en bestelcode.js staan in de root (één bron, gedeeld met de kassa)
# en worden bij het bouwen naast index.html gekopieerd. Geen functions.
# Het clublogo (../assets/clublogo.png) wordt bij het bouwen naar bestel/assets/ gekopieerd;
# lokaal staat het daar pas na dezelfde kopie (cp, zie command).
[build]
  command = "cp ../producten.js ../bestelcode.js ./ && mkdir -p assets && cp ../assets/clublogo.png assets/clublogo.png"
  publish = "."
  # Ook opnieuw bouwen als de gedeelde productlijst, bestelcode of het clublogo in de root wijzigt
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../producten.js ../bestelcode.js ../assets/clublogo.png"
